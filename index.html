<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTV — Stencil Rebellion System</title>
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <div id="ui">
    <h1>MTV: STENCIL REBELLION</h1>
    <p>Intervén el lienzo corporativo rígido aplicando stencils y aerosol libre.</p>
    <div class="controls">
      <button class="btn active" data-stencil="m">Stencil 'M'</button>
      <button class="btn" data-stencil="tv">Stencil 'TV'</button>
      <button class="btn" data-stencil="spray">Aerosol Caótico</button>
      <button class="btn btn-clear" id="btn-clear">Restablecer Grilla</button>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
