<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTV — Stencil Rebellion System</title>
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <div id="ui">
    <h1>MTV: STENCIL REBELLION</h1>
    <p><strong>1.</strong> Fija stencils o usa el aerosol libremente.<br/>
       <strong>2.</strong> <strong>Vandaliza/Cubre</strong> los 3 carteles corporativos.<br/>
       <strong>3.</strong> ¡Desbloquea el logo de MTV al completar la rebelión!</p>

    <!-- Barra de Progreso de Rebelión -->
    <div class="section-label">PROGRESO DE REBELIÓN:</div>
    <div class="progress-bar-container">
      <div id="progress-fill"></div>
    </div>
    <div id="progress-text">Cubre los carteles corporativos (0/3)</div>

    <!-- Herramientas -->
    <div class="section-label">HERRAMIENTAS:</div>
    <div class="controls">
      <button class="btn active" data-stencil="m">Stencil 'M'</button>
      <button class="btn" data-stencil="tv">Stencil 'TV'</button>
      <button class="btn" data-stencil="mtv">Stencil 'MTV'</button>
      <button class="btn" data-stencil="spray">Aerosol Libre</button>
    </div>

    <!-- Colores -->
    <div class="section-label">COLOR DE AEROSOL:</div>
    <div class="color-picker">
      <div class="color-dot active" data-color="#ff0055" style="background-color: #ff0055;" title="Rosa Neón"></div>
      <div class="color-dot" data-color="#ffff00" style="background-color: #ffff00;" title="Amarillo"></div>
      <div class="color-dot" data-color="#00ffff" style="background-color: #00ffff;" title="Cyan"></div>
      <div class="color-dot" data-color="#ffffff" style="background-color: #ffffff;" title="Blanco"></div>
      <div class="color-dot" data-color="#111111" style="background-color: #111111;" title="Negro"></div>
    </div>

    <!-- Acciones -->
    <button class="btn btn-lift" id="btn-lift">🖐️ Levantar Plantillas</button>
    <button class="btn btn-clear" id="btn-clear">Restablecer Afiche Suizo</button>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
